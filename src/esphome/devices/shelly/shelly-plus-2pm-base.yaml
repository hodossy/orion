---
substitutions:
  device_version: "shelly2pm.4"
  max_device_temperature: "90.0"
  max_channel_current: "8.0"
  # for inductive loads a current spike is expected and normal
  # increase the value to 1 or 2 max to avoid actual overloads
  allowed_overload: "0"

  ch_1_max_current: "${max_channel_current}"
  ch_2_max_current: "${max_channel_current}"

  ch_1_allowed_overload: "${allowed_overload}"
  ch_2_allowed_overload: "${allowed_overload}"

  ch_1_restore_mode: ALWAYS_OFF
  ch_2_restore_mode: ALWAYS_OFF

  ch_1_total_daily_energy_name: "${friendly_name} Total Daily Energy CH 1"
  ch_2_total_daily_energy_name: "${friendly_name} Total Daily Energy CH 2"

packages:
  base: !include ../../common/base.yaml
  time: !include ../../common/time.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: update_ade7953

globals:
  - id: ch_1_switch_overload
    type: int
    restore_value: false
    initial_value: "0"
  - id: ch_2_switch_overload
    type: int
    restore_value: false
    initial_value: "0"

# internal Shelly Switch Outputs
switch:
  - platform: gpio
    id: ch_1_switch
    pin: GPIO13
    internal: true
    restore_mode: ${ch_1_restore_mode}
  - platform: gpio
    id: ch_2_switch
    pin: GPIO12
    internal: true
    restore_mode: ${ch_2_restore_mode}

i2c:
  sda: GPIO26
  scl: GPIO25

# internal sensors to help energy metering
# delayed off helps to measure consumption accurately
binary_sensor:
  - platform: switch
    id: ch_1_should_be_metered
    internal: true
    source_id: ch_1_switch
    filters:
      - delayed_off: 1s
    on_press:
      - script.execute: update_ade7953
  - platform: switch
    id: ch_2_should_be_metered
    internal: true
    source_id: ch_2_switch
    filters:
      - delayed_off: 1s
    on_press:
      - script.execute: update_ade7953

sensor:
  # internal temperature sensor
  - platform: ntc
    sensor: temp_resistance_reading
    name: "${friendly_name} Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    entity_category: "diagnostic"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      # ATTENTION in other template configurations for the Shelly Plus 2PM, the resistance is 4.7k
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_device_temperature}
        then:
          - switch.turn_off: ch_1_switch
          - switch.turn_off: ch_2_switch
          - homeassistant.action:
              action: persistent_notification.create
              data:
                title: "Message from ${friendly_name}"
              data_template:
                message: "Relays turned off because temperature exceeded ${max_device_temperature} °C"

  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    # ATTENTION in other template configurations for the Shelly Plus 2PM, the resistance is 5.6k
    resistor: 10kOhm

  - platform: adc
    id: temp_analog_reading
    pin: GPIO35
    attenuation: 12db
    update_interval: 60s

  # power monitoring
  - platform: ade7953_i2c
    id: energy_meter
    # Prevent overheating by setting irq_pin
    irq_pin: GPIO27
    voltage:
      name: "${friendly_name} Voltage"
      unit_of_measurement: V
      accuracy_decimals: 0
      icon: mdi:flash-outline
      filters:
        - delta: 1
    # On the Shelly Plus 2PM bought in Austria in 2024, the channels are in order: ch1=A ch2=B
    current_a:
      id: ch_1_current
      name: "${friendly_name} Current CH 1"
      unit_of_measurement: A
      accuracy_decimals: 2
      icon: mdi:current-ac
      on_value_range:
        - above: ${ch_1_max_current}
          then:
            - lambda: "id(ch_1_switch_overload) += 1;"
            - if:
                condition: 
                  lambda: "return id(ch_1_switch_overload) > ${ch_1_allowed_overload};"
                then:
                  - switch.turn_off: ch_1_switch
                  - lambda: "id(ch_1_switch_overload) = 0;"
                  - homeassistant.action:
                      action: persistent_notification.create
                      data:
                        title: "Message from ${friendly_name}"
                      data_template:
                        message: "Turned off because current on CH 1 exceeded ${ch_1_max_current} A"
        - below: ${ch_1_max_current}
          then:
            - lambda: "id(ch_1_switch_overload) = 0;"
    current_b:
      id: ch_2_current
      name: "${friendly_name} Current CH 2"
      unit_of_measurement: A
      accuracy_decimals: 2
      icon: mdi:current-ac
      on_value_range:
        - above: ${ch_2_max_current}
          then:
            - lambda: "id(ch_2_switch_overload) += 1;"
            - if:
                condition: 
                  lambda: "return id(ch_2_switch_overload) > ${ch_2_allowed_overload};"
                then:
                  - switch.turn_off: ch_2_switch
                  - lambda: "id(ch_2_switch_overload) = 0;"
                  - homeassistant.action:
                      action: persistent_notification.create
                      data:
                        title: "Message from ${friendly_name}"
                      data_template:
                        message: "Turned off because current on CH 2 exceeded ${ch_2_max_current} A"
        - below: ${ch_2_max_current}
          then:
            - lambda: "id(ch_2_switch_overload) = 0;"
    active_power_a:
      name: "${friendly_name} Power CH 1"
      id: ch_1_power
      unit_of_measurement: W
      icon: mdi:gauge
      # active_power_a is inverted, so multiply by -1
      filters:
        - lambda: |-
            if (x < 0) return -1 * x;
            return x;
    active_power_b:
      name: "${friendly_name} Power CH 2"
      id: ch_2_power
      unit_of_measurement: W
      icon: mdi:gauge
      # active_power_b is inverted, so multiply by -1
      filters:
        - lambda: |-
            if (x < 0) return -1 * x;
            return x;
    update_interval: never

  - platform: total_daily_energy
    name: "${ch_1_total_daily_energy_name}"
    power_id: ch_1_power
    method: left
  - platform: total_daily_energy
    name: "${ch_2_total_daily_energy_name}"
    power_id: ch_2_power
    method: left

script:
  - id: update_ade7953
    mode: single
    then:
      - delay: 100ms
      - while:
          condition:
            any:
              - binary_sensor.is_on: ch_1_should_be_metered
              - binary_sensor.is_on: ch_2_should_be_metered
          then:
            - component.update: energy_meter
            - delay: 500ms
