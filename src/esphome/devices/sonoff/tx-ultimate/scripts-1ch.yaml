---
light:
  - platform: partition
    id: leds_button_middle
    internal: true
    segments:
      - id: leds
        from: 9
        to: 9
  - platform: partition
    id: leds_nightlight
    internal: true
    segments:
      - id: leds
        from: 0
        to: 8
      - id: leds
        from: 10
        to: 19
      - id: leds
        from: 27
        to: 27
      - id: leds_top
        from: 0
        to: 6
script:
  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - light.toggle: ${light_1_id}
  - id: refresh_button_leds
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: ${relay_1_id}
          then:
            - script.execute: led_on_button_middle
          else:
            - script.execute: led_off_button_middle
  - id: led_on_button_middle
    mode: restart
    then:
      - light.turn_on:
          id: leds_button_middle
          brightness: ${button_brightness}
          red: !lambda "return id(button_color)[0]/100.0;"
          green: !lambda "return id(button_color)[1]/100.0;"
          blue: !lambda "return id(button_color)[2]/100.0;"
  - id: led_off_button_middle
    mode: restart
    then:
      - if:
          condition:
            light.is_on: leds
          then:
            - light.turn_on:
                id: leds_button_middle
                brightness: !lambda "return id(leds).current_values.get_brightness();"
                red: !lambda "return id(leds).current_values.get_red();"
                green: !lambda "return id(leds).current_values.get_green();"
                blue: !lambda "return id(leds).current_values.get_blue();"
          else:
            - if:
                condition:
                  lambda: "return id(nightlight).state;"
                then:
                  - light.turn_on:
                      id: leds_button_middle
                      brightness: ${nightlight_brightness}
                      red: !lambda "return id(nightlight_color)[0]/100.0;"
                      green: !lambda "return id(nightlight_color)[1]/100.0;"
                      blue: !lambda "return id(nightlight_color)[2]/100.0;"
                else:
                  - light.turn_off: leds_button_middle
